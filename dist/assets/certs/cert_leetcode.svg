<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#18132d"/>
      <stop offset="100%" stop-color="#0a0815"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Orange LeetCode Gradient -->
    <linearGradient id="lcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa116"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>

    <!-- Subtle Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 161, 22, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="url(#bgGrad)"/>
  <rect width="1000" height="750" fill="url(#gridPattern)"/>

  <!-- Ornate Outer Border -->
  <rect x="25" y="25" width="950" height="700" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85"/>
  <rect x="35" y="35" width="930" height="680" rx="12" fill="none" stroke="rgba(255, 161, 22, 0.3)" stroke-width="1"/>
  <rect x="42" y="42" width="916" height="666" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Corner Flourishes -->
  <path d="M 35 75 L 35 35 L 75 35" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="35" cy="35" r="4" fill="#fef08a"/>
  <path d="M 965 75 L 965 35 L 925 35" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="965" cy="35" r="4" fill="#fef08a"/>
  <path d="M 35 675 L 35 715 L 75 715" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="35" cy="715" r="4" fill="#fef08a"/>
  <path d="M 965 675 L 965 715 L 925 715" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="965" cy="715" r="4" fill="#fef08a"/>

  <!-- LeetCode Header Logo Icon -->
  <g transform="translate(430, 75)">
    <!-- LeetCode Bracket/Bar Icon -->
    <path d="M30 10 L50 25 L42 34 L28 24 Z" fill="#b3b3b3"/>
    <path d="M12 40 C12 25, 25 14, 40 14 C50 14, 58 19, 62 25 L50 35 C47 31, 44 28, 38 28 C28 28, 22 35, 22 45 C22 55, 28 62, 38 62 C44 62, 48 58, 52 54 L64 64 C58 71, 49 76, 38 76 C22 76, 12 64, 12 45 Z" fill="url(#lcGrad)"/>
    <path d="M42 42 L80 42 L80 50 L42 50 Z" fill="#b3b3b3"/>
    <text x="95" y="55" font-family="'Outfit', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">LeetCode</text>
  </g>

  <!-- Title -->
  <text x="500" y="210" text-anchor="middle" font-family="'Outfit', serif" font-size="30" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">CERTIFICATE OF EXCELLENCE</text>
  <text x="500" y="245" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="3">ALGORITHM MASTERY &amp; PROBLEM SOLVING</text>

  <!-- Divider Line -->
  <line x1="380" y1="265" x2="620" y2="265" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="500,260 505,265 500,270 495,265" fill="#fef08a"/>

  <!-- Recipient -->
  <text x="500" y="315" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#cbd5e1">THIS IS PROUDLY PRESENTED TO</text>
  <text x="500" y="380" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="2">Dinesh N</text>

  <!-- Certificate Description -->
  <text x="500" y="430" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="15" fill="#94a3b8">for demonstrating exceptional problem-solving proficiency across Data Structures &amp; Algorithms,</text>
  <text x="500" y="455" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="15" fill="#94a3b8">consistently solving 500+ Medium &amp; Hard algorithm challenges with optimal time-space complexity.</text>

  <!-- LeetCode Knight Badge & Stats (Left Center) -->
  <g transform="translate(140, 500)">
    <rect width="180" height="90" rx="12" fill="rgba(255, 161, 22, 0.08)" stroke="rgba(255, 161, 22, 0.3)" stroke-width="1"/>
    <text x="90" y="32" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffa116" letter-spacing="1">RANKING BADGE</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Top Solver</text>
    <text x="90" y="78" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="#94a3b8">Contest Rating: 1850+</text>
  </g>

  <!-- Golden Seal (Center) -->
  <g transform="translate(450, 480)">
    <circle cx="50" cy="50" r="48" fill="url(#goldGrad)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>
    <circle cx="50" cy="50" r="41" fill="#120e24" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Star & Text in Seal -->
    <path d="M 50 25 L 53 35 L 63 35 L 55 42 L 58 52 L 50 46 L 42 52 L 45 42 L 37 35 L 47 35 Z" fill="url(#goldGrad)"/>
    <text x="50" y="66" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8" font-weight="800" fill="#fef08a" letter-spacing="1">VERIFIED</text>
    <text x="50" y="76" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">EXCELLENCE</text>
    <!-- Ribbon tails below seal -->
    <polygon points="35,92 20,135 38,125 50,138 45,95" fill="#d97706" opacity="0.9"/>
    <polygon points="65,92 80,135 62,125 50,138 55,95" fill="#b45309" opacity="0.9"/>
  </g>

  <!-- Credential ID Box (Right Center) -->
  <g transform="translate(680, 500)">
    <rect width="180" height="90" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="90" y="32" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">CREDENTIAL ID</text>
    <text x="90" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#fef08a">LC-ALG-889421</text>
    <text x="90" y="78" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="#10b981">&#10003; Authenticated</text>
  </g>

  <!-- Signatures & Date Bottom Row -->
  <g transform="translate(140, 650)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="100" y="-12" text-anchor="middle" font-family="'Outfit', cursive, sans-serif" font-size="18" fill="#cbd5e1" font-style="italic">Winston Tang</text>
    <text x="100" y="18" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">LeetCode Evaluation Team</text>
    <text x="100" y="32" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" fill="#64748b">Algorithms &amp; System Design</text>
  </g>

  <g transform="translate(660, 650)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="100" y="-12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#cbd5e1">2023 - 2024</text>
    <text x="100" y="18" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Issue Date</text>
    <text x="100" y="32" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" fill="#64748b">Lifetime Verification</text>
  </g>
</svg>
